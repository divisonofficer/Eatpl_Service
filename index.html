<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>회식픽 — 회식 장소 5분 컷</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="map" aria-label="지도"></div>

  <!-- 상단: 검색 + 필터 + 모드 탭 -->
  <header id="top">
    <form class="search" id="filters" role="search">
      <span class="search-ic" id="searchIc"></span>
      <input id="loc" placeholder="동네·역·회사 검색" autocomplete="off" enterkeyhint="search" />
    </form>
    <ul id="suggest" class="suggest" role="listbox" hidden></ul>
    <div class="quick" id="quick">
      <div class="picker" id="modePicker" role="radiogroup" aria-label="모드"></div>
      <div class="picker" id="sizePicker" role="radiogroup" aria-label="인원"></div>
      <div class="picker" id="dayPicker" role="radiogroup" aria-label="요일"></div>
    </div>
    <div class="quick2">
      <button type="button" id="filterBtn" class="cat-btn" aria-label="업종 선택"></button>
      <div id="prefRow" class="pref-row" role="group" aria-label="룸·주차·콜키지"></div>
    </div>
  </header>

  <button type="button" id="areaBtn" class="area-btn" hidden></button>

  <!-- 지도 플로팅 버튼 -->
  <div class="fabs" id="fabs">
    <button type="button" id="locateBtn" class="fab" aria-label="내 위치 주변 검색"></button>
  </div>

  <!-- 목록 바텀시트 (데스크톱: 좌측 패널) -->
  <section id="sheet" data-snap="half" aria-label="검색 결과">
    <div class="sheet-head" id="sheetHead">
      <div class="handle" aria-hidden="true"></div>
      <div class="head-row">
        <div class="head-text">
          <div class="head-title"><span id="resultCount" role="status">-</span> <span id="statusBadge" class="badge" hidden></span></div>
        </div>
        <button id="candBtn" class="cand-btn" disabled hidden><span id="candIc"></span><span><b id="candCount">0</b>곳 알리기</span></button>
      </div>
    </div>
    <ol id="results"></ol>
  </section>

  <!-- 핀 선택 시 미리보기 카드 (좌우로 넘기기) -->
  <section id="preview" class="preview" hidden aria-label="매장 미리보기">
    <div id="pvTrack" class="pv-track"></div>
  </section>

  <!-- 필터 시트 -->
  <dialog id="filterDialog" class="bottom-dialog">
    <div class="bd-head">
      <strong>업종 · 팀</strong>
      <button type="button" class="icon-btn" data-close aria-label="닫기"></button>
    </div>
    <div class="bd-section">
      <div class="bd-label">우리 팀 <span class="bd-hint">선택 · 비슷한 손님이 단골인 곳 추천</span></div>
      <div id="ageRow" class="age-row"></div>
      <div id="genderRow" class="age-row gender-row"></div>
    </div>
    <div class="bd-section">
      <div class="bd-label">업종</div>
      <div id="catGrid" class="cat-grid"></div>
    </div>
    <div class="bd-actions">
      <button type="button" id="filterReset" class="btn btn-ghost">초기화</button>
      <button type="button" id="filterApply" class="btn btn-primary">적용</button>
    </div>
  </dialog>

  <!-- 매장 상세 -->
  <dialog id="detail" class="page" aria-label="매장 상세"></dialog>

  <!-- 결정·공유 -->
  <dialog id="decide" class="page" aria-label="후보 결정"></dialog>

  <div id="inapp" class="inapp" hidden>
    <a id="inappOpen" href="#">기본 브라우저로 열기</a>
    <button type="button" class="icon-btn" aria-label="닫기" onclick="this.parentElement.hidden=true"></button>
  </div>

  <div id="toast" role="status" hidden></div>

  <script src="vendor/proj4.js"></script>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/maplibre/maplibre-gl.js"></script>
  <script src="vendor/maplibre/leaflet-maplibre-gl.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
